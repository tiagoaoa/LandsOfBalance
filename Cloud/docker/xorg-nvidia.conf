# Headless Xorg for one NVIDIA GPU — used by `lobcloud --display-mode xorg`.
# The gateway starts `Xorg :N -config this-file` per session, so several
# X servers share the card. Set BusID to your GPU (`nvidia-xconfig --query-gpu-info`
# or `lspci | grep NVIDIA`; 01:00.0 → PCI:1:0:0).
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "nvidia"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
    Option "ProbeAllGpus" "false"
EndSection

Section "Monitor"
    Identifier "virtual"
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier "screen"
    Device "nvidia"
    Monitor "virtual"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
        Modes "1920x1080" "1280x720"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
    Option "AutoAddDevices" "false"
EndSection
